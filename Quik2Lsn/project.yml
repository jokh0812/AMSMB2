# XcodeGen spec — run `xcodegen generate` in this folder to create Quik2Lsn.xcodeproj.
# Before building, replace the bundle ID prefix below and set DEVELOPMENT_TEAM.
name: Quik2Lsn
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""   # your Apple Developer Team ID
    CODE_SIGN_STYLE: Automatic

targets:
  # iPhone companion: transcribes recordings and calls Claude.
  Quik2Lsn:
    type: application
    platform: iOS
    sources:
      - iOS
      - Shared
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: Quik2Lsn
        UILaunchScreen: {}
        # Siri: pronounce the name as "Quick to Listen" and also accept
        # "Meeting Notes" as the app name ("Start meeting notes").
        CFBundleSpokenName: Quick to Listen
        INAlternativeAppNames:
          - INAlternativeAppName: Meeting Notes
          - INAlternativeAppName: Quick Listen
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSSpeechRecognitionUsageDescription: Quik2Lsn transcribes meetings you record on your Apple Watch so Claude can summarize them.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.quik2lsn
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: Quik2LsnWatch
        embed: true
        copy:
          destination: productsDirectory
          subpath: $(CONTENTS_FOLDER_PATH)/Watch

  # Apple Watch app: records meetings and shows notes.
  Quik2LsnWatch:
    type: application
    platform: watchOS
    sources:
      - Watch
      - Shared
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: Quik2Lsn
        WKApplication: true
        # Siri: pronounce the name as "Quick to Listen" and also accept
        # "Meeting Notes" as the app name ("Start meeting notes").
        CFBundleSpokenName: Quick to Listen
        INAlternativeAppNames:
          - INAlternativeAppName: Meeting Notes
          - INAlternativeAppName: Quick Listen
        WKCompanionAppBundleIdentifier: com.example.quik2lsn
        WKRunsIndependentlyOfCompanionApp: false
        WKBackgroundModes: [audio]
        NSMicrophoneUsageDescription: Quik2Lsn records your meetings so they can be transcribed and summarized.
        CFBundleURLTypes:
          - CFBundleURLName: com.example.quik2lsn.watchkitapp
            CFBundleURLSchemes: [quik2lsn]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.quik2lsn.watchkitapp
        PRODUCT_NAME: Quik2LsnWatch
    dependencies:
      - target: Quik2LsnComplication

  # Watch-face complication that launches straight into recording.
  Quik2LsnComplication:
    type: app-extension
    platform: watchOS
    sources:
      - WatchWidget
    info:
      path: WatchWidget/Info.plist
      properties:
        CFBundleDisplayName: Quik2Lsn
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.quik2lsn.watchkitapp.complication
